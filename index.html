<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>闪记 · FlashNote — Support</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
      background: #f5f5f7;
      color: #1d1d1f;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      text-align: center;
      padding: 48px 24px;
    }
    .logo {
      width: 80px;
      height: 80px;
      margin: 0 auto 24px;
      background: linear-gradient(135deg, #007AFF, #5856D6);
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .logo svg {
      width: 44px;
      height: 44px;
      fill: white;
    }
    h1 {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
    }
    .subtitle {
      font-size: 16px;
      color: #86868b;
      margin-bottom: 40px;
    }
    .card {
      background: white;
      border-radius: 16px;
      padding: 32px;
      max-width: 400px;
      margin: 0 auto 24px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    }
    .card p {
      font-size: 15px;
      color: #1d1d1f;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .email-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #007AFF;
      color: white;
      text-decoration: none;
      padding: 12px 24px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 500;
      transition: background 0.2s;
    }
    .email-link:hover { background: #0056CC; }
    .email-link svg {
      width: 18px;
      height: 18px;
      fill: white;
    }
    .footer {
      font-size: 13px;
      color: #86868b;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M13 3L4 14h7v7l9-11h-7V3z"/>
      </svg>
    </div>
    <h1>闪记</h1>
    <p class="subtitle">FlashNote · 支持</p>

    <div class="card">
      <p>如在使用中遇到问题或有任何建议，欢迎联系我们：</p>
      <a class="email-link" href="mailto:lisiurday@gmail.com">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/>
        </svg>
        lisiurday@gmail.com
      </a>
    </div>

    <p class="footer">© 2026 FlashNote. All rights reserved.</p>
  </div>
</body>
</html>
